{# shared project form body — included inside a <form> by project_create.html
   and project_update.html (WO-0.5 §4) #}
{{ form.non_field_errors }}
{% for field in form %}
  <div class="form-group">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}
      <small class="form-text text-muted">{{ field.help_text }}</small>
    {% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
