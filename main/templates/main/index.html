{% extends "main/base.html" %}
{% block title %}<title>CPDraw</title>{% endblock %}

{% block content %}
<div class="container">
  <div class="pt-3">
    <p>A tool for digitizing features found on historical maps and maps of history.</p>
    <p>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Go to your dashboard…</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a> or
        <a href="{% url 'register' %}">create an account</a> to begin.
      {% endif %}
    </p>
  </div>
</div>
{% endblock %}
