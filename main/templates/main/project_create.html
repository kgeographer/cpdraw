{% extends "main/base.html" %}
{% block title %}<title>CPDraw — new project</title>{% endblock %}

{% block content %}
<div class="container mt-3">
  <nav class="small mb-2">
    <a href="{% url 'dashboard' %}">Dashboard</a> <span class="text-muted">/</span> new project
  </nav>
  <h4 class="text-warning">New project</h4>
  <form method="post" style="max-width: 32rem">{% csrf_token %}
    {% include "main/_project_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="ml-2 small" href="{% url 'dashboard' %}">Cancel</a>
  </form>
</div>
{% endblock %}
