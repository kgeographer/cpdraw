{% extends 'main/base.html' %}
{% block title %}<title>CPDraw — register</title>{% endblock %}

{% block content %}
<div class="container mt-3" style="max-width: 480px;">
  <h4 class="text-warning">Create an account</h4>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="mt-3 small">Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
</div>
{% endblock %}
