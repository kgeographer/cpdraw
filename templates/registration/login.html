{% extends 'main/base.html' %}
{% block title %}<title>CPDraw — log in</title>{% endblock %}

{% block content %}
<div class="container mt-3" style="max-width: 420px;">
  <h4 class="text-warning">Log in</h4>
  {% if form.errors %}
    <div class="alert alert-danger">That username and password don't match.</div>
  {% endif %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="mt-3 small">
    <a href="{% url 'password_reset' %}">Forgot your password?</a><br>
    New here? <a href="{% url 'register' %}">Create an account</a>.
  </p>
</div>
{% endblock %}
