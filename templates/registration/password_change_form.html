{% extends 'main/base.html' %}
{% block title %}<title>CPDraw — change password</title>{% endblock %}

{% block content %}
<div class="container mt-3" style="max-width: 480px;">
  <h4 class="text-warning">Change your password</h4>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Change my password</button>
  </form>
  <p class="mt-3 small"><a href="{% url 'profile' %}">Back to your profile</a></p>
</div>
{% endblock %}
