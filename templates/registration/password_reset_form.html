{% extends 'main/base.html' %}
{% block title %}<title>CPDraw — reset password</title>{% endblock %}

{% block content %}
<div class="container mt-3" style="max-width: 480px;">
  <h4 class="text-warning">Reset your password</h4>
  <p class="small">Enter the e-mail on your account and we'll send a reset link.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send reset link</button>
  </form>
  <p class="mt-3 small"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
